name: MEXC 4-Hour Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scanner.py"
      - "test_*.py"
      - ".github/workflows/hourly_scan.yml"
      - "trigger/scan_request.txt"

permissions:
  contents: write

concurrency:
  group: mexc-4-hour-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest -v

      - name: Run complete MEXC scan
        run: python scanner.py

      - name: Validate machine-readable output
        run: |
          python -m json.tool output/latest_report.json >/dev/null
          python -m json.tool output/status.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          import scanner

          report = json.loads(Path("output/latest_report.json").read_text(encoding="utf-8"))
          status = json.loads(Path("output/status.json").read_text(encoding="utf-8"))
          scanner.validate_report(report)

          expected_nearby = report["strong_level_counts"]["nearby"]
          if status["nearby_strong_level_count"] != expected_nearby:
              raise SystemExit("status/latest nearby count mismatch")
          if status["scan_timestamp_utc"] != report["scan_timestamp_utc"]:
              raise SystemExit("status/latest timestamp mismatch")
          if status["decision"] != report["decision"]:
              raise SystemExit("status/latest decision mismatch")
          PY

      - name: Publish latest report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/latest_report.json output/latest_report.md output/status.json
          if [ -f output/previous_report.json ]; then git add output/previous_report.json; fi
          if git diff --cached --quiet; then
            echo "No report changes to publish"
            exit 0
          fi
          git commit -m "4-hour MEXC scan $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git pull --rebase origin main
          git push origin HEAD:main
